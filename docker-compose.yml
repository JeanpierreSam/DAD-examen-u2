version: '3.8'
services:
  postgres-instructor:
    image: postgres:16-alpine
    container_name: postgres-instructor
    environment:
      POSTGRES_DB: instructor_db
      POSTGRES_USER: instructor_user
      POSTGRES_PASSWORD: instructor_pass
    ports:
      - "5438:5432"
  postgres-alumno:
    image: postgres:16-alpine
    container_name: postgres-alumno
    environment:
      POSTGRES_DB: alumno_db
      POSTGRES_USER: alumno_user
      POSTGRES_PASSWORD: alumno_pass
    ports:
      - "5439:5432"
  postgres-taller:
    image: postgres:16-alpine
    container_name: postgres-taller
    environment:
      POSTGRES_DB: taller_db
      POSTGRES_USER: taller_user
      POSTGRES_PASSWORD: taller_pass
    ports:
      - "5440:5432"
