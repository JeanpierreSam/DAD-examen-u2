server.port=8080

# Habilitar descubrimiento dinámico
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Enrutamiento de solicitudes
spring.cloud.gateway.mvc.routes[0].id=instructor-route
spring.cloud.gateway.mvc.routes[0].uri=lb://ms-gestion-instructor
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/instructores/**

spring.cloud.gateway.mvc.routes[1].id=alumno-route
spring.cloud.gateway.mvc.routes[1].uri=lb://ms-gestion-alumno
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/alumnos/**

spring.cloud.gateway.mvc.routes[2].id=taller-route
spring.cloud.gateway.mvc.routes[2].uri=lb://ms-gestion-taller
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/talleres/**